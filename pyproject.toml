[project]
name = "breaking-change-sentinel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Titouan", email = "titouan.dechanet@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8.0",
    "langchain-text-splitters>=1.1.2",
    "qdrant-client>=1.19.0",
]

[project.scripts]
breaking-change-sentinel = "breaking_change_sentinel:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
ignore_missing_imports = true
